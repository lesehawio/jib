<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <style>
      /* انیمیشن نگاه کردن به اطراف (نگاه به چپ، راست و مرکز) */
      @keyframes lookAroundLeft {
        0%, 100% { transform: translate(62px, 86px); }
        20% { transform: translate(56px, 86px); }  /* نگاه به چپ */
        40% { transform: translate(66px, 86px); }  /* نگاه به راست */
        60% { transform: translate(62px, 82px); }  /* نگاه به بالا/ارتباط */
        80% { transform: translate(62px, 88px); }  /* نگاه نرم به پایین */
      }

      @keyframes lookAroundRight {
        0%, 100% { transform: translate(101px, 86px); }
        20% { transform: translate(95px, 86px); }  /* نگاه به چپ */
        40% { transform: translate(105px, 86px); }  /* نگاه به راست */
        60% { transform: translate(101px, 82px); }  /* نگاه به بالا/ارتباط */
        80% { transform: translate(101px, 88px); }  /* نگاه نرم به پایین */
      }

      /* انیمیشن پلک زدن مینیمال (مورفین به خط افقی و باز شدن) */
      @keyframes eyeBlink {
        0%, 48%, 52%, 88%, 92%, 100% {
          transform: scaleY(1);
        }
        50%, 90% {
          transform: scaleY(0.08); /* پلک زدن سریع و مدرن */
        }
      }

      .left-comma-group {
        animation: lookAroundLeft 6s ease-in-out infinite;
      }

      .right-comma-group {
        animation: lookAroundRight 6s ease-in-out infinite;
      }

      .blink-element {
        transform-origin: 10px 0px;
        animation: eyeBlink 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- فریم اصلی جیب -->
  <path d="M27 35 H153 V115 Q153 153 115 153 H65 Q27 153 27 115 Z" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- خط بالای جیب -->
  <path d="M27 58 H153" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" />

  <!-- گروه چشمان ویرگولی -->
  <g fill="#2fb557">

    <!-- ویرگول سمت چپ (با نگاه به اطراف و پلک زدن) -->
    <g class="left-comma-group">
      <g class="blink-element">
        <path d="M0 0
                 Q0 -12 10 -12
                 Q20 -12 20 0
                 Q20 10 6 19
                 Q0 22 0 17
                 Q10 8 10 3
                 Q0 11 0 0Z" />
      </g>
    </g>

    <!-- ویرگول سمت راست (با نگاه به اطراف و پلک زدن) -->
    <g class="right-comma-group">
      <g class="blink-element">
        <path d="M0 0
                 Q0 -12 10 -12
                 Q20 -12 20 0
                 Q20 10 6 19
                 Q0 22 0 17
                 Q10 8 10 3
                 Q0 11 0 0Z" />
      </g>
    </g>

  </g>
</svg>
