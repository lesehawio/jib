<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>جیب ✦ موتور جستجوی زندگی روزمره</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cpath d='M27 35 H153 V115 Q153 153 115 153 H65 Q27 153 27 115 Z' fill='none' stroke='%232fb557' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M27 58 H153' fill='none' stroke='%232fb557' stroke-width='11' stroke-linecap='round'/%3E%3Cg fill='%232fb557'%3E%3Cg transform='translate(62 86)'%3E%3Cpath d='M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z'/%3E%3C/g%3E%3Cg transform='translate(101 86)'%3E%3Cpath d='M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== SPLASH SCREEN ===== -->
    <div class="splash-screen" id="splashScreen">
        <svg viewBox="0 0 180 180" width="120" height="120">
            <path d="M27 35 H153 V115 Q153 153 115 153 H65 Q27 153 27 115 Z" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M27 58 H153" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round"/>
            <g fill="#2fb557">
                <g transform="translate(62 86)">
                    <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z"/>
                </g>
                <g transform="translate(101 86)">
                    <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z"/>
                </g>
            </g>
        </svg>
        <div class="splash-brand">Jib</div>
        <div class="splash-tagline">بذارمش توی جیبم</div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            <div class="logo-motion">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 125" width="250" height="125">
                    <defs>
                        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#A2FFC0"/>
                            <stop offset="35%" stop-color="#2fb557"/>
                            <stop offset="75%" stop-color="#16833F"/>
                            <stop offset="100%" stop-color="#75E99A"/>
                        </linearGradient>
                        <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
                            <stop offset="48%" stop-color="#fff"/>
                            <stop offset="55%" stop-color="#C8FFDA"/>
                            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                        </linearGradient>
                        <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="3.5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="shineGlow" x="-80%" y="-80%" width="260%" height="260%">
                            <feGaussianBlur stdDeviation="1.5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <style>
                        .script {
                            font-family: "Brush Script MT", "Segoe Script", "URW Chancery L", "Apple Chancery", cursive;
                            font-weight: bold;
                            font-style: italic;
                            fill: url(#ink);
                            filter: url(#neon);
                        }
                        .jib {
                            font-size: 86px;
                            animation: jibIn 7s cubic-bezier(.18,.75,.25,1) infinite;
                            transform-origin: 125px 67px;
                        }
                        .poket {
                            font-size: 72px;
                            animation: poketIn 7s cubic-bezier(.18,.75,.25,1) infinite;
                            transform-origin: 125px 67px;
                        }
                        .swash {
                            fill: none;
                            stroke: url(#ink);
                            stroke-width: 3.2;
                            stroke-linecap: round;
                            stroke-dasharray: 180;
                            stroke-dashoffset: 180;
                            filter: url(#shineGlow);
                            animation: drawSwash 7s ease-in-out infinite;
                        }
                        .flash {
                            fill: url(#flash);
                            opacity: 0;
                            filter: url(#shineGlow);
                            animation: flashPass 7s ease-in-out infinite;
                        }
                        .star {
                            fill: #8CF5AD;
                            filter: url(#neon);
                            transform-box: fill-box;
                            transform-origin: center;
                            animation: starPop 2s ease-in-out infinite alternate;
                        }
                        .star.two { animation-delay: .5s; }
                        .star.three { animation-delay: 1s; }
                        @keyframes jibIn {
                            0%, 5% { opacity: 0; transform: translate(-12px, 13px) rotate(-9deg) scale(.78); }
                            13% { opacity: 1; transform: translate(3px, -2px) rotate(2deg) scale(1.06); }
                            19%, 39% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
                            46%, 100% { opacity: 0; transform: translate(15px, -12px) rotate(7deg) scale(1.12); }
                        }
                        @keyframes poketIn {
                            0%, 42% { opacity: 0; transform: translate(-10px, 12px) rotate(-7deg) scale(.8); }
                            51% { opacity: 1; transform: translate(2px, -2px) rotate(2deg) scale(1.05); }
                            57%, 85% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
                            93%, 100% { opacity: 0; transform: translate(12px, -10px) rotate(6deg) scale(1.1); }
                        }
                        @keyframes drawSwash {
                            0%, 10% { stroke-dashoffset: 180; opacity: 0; }
                            20%, 38% { stroke-dashoffset: 0; opacity: 1; }
                            47%, 100% { stroke-dashoffset: -180; opacity: 0; }
                        }
                        @keyframes flashPass {
                            0%, 15% { opacity: 0; transform: translateX(-160px); }
                            22% { opacity: .85; }
                            34%, 100% { opacity: 0; transform: translateX(260px); }
                        }
                        @keyframes starPop {
                            from { opacity: .15; transform: scale(.5) rotate(0); }
                            to { opacity: 1; transform: scale(1.6) rotate(45deg); }
                        }
                    </style>
                    <text class="script jib logo-jib-text" x="125" y="78" text-anchor="middle">Jib</text>
                    <text class="script poket logo-pocket-text" x="125" y="78" text-anchor="middle">Poket</text>
                    <path class="swash" d="M48 91 Q91 111 135 94 Q162 83 191 94"/>
                    <rect class="flash" x="0" y="15" width="70" height="90" rx="35"/>
                    <path class="star" d="M35 28 L38 35 L45 38 L38 41 L35 48 L32 41 L25 38 L32 35 Z"/>
                    <path class="star two" d="M207 25 L209 30 L214 32 L209 34 L207 39 L205 34 L200 32 L205 30 Z"/>
                    <circle class="star three" cx="216" cy="77" r="2"/>
                </svg>
                <span class="blob"></span>
                <span class="blob"></span>
                <span class="blob"></span>
                <span class="blob"></span>
                <span class="blob"></span>
                <span class="blob"></span>
                <span class="blob"></span>
            </div>
        </div>
        <div class="header-right">
            <button class="lang-btn" id="langBtn">FA</button>
        </div>
    </header>

    <!-- ===== میکروفون جستجو ===== -->
    <div class="mic-overlay" id="micOverlay">
        <button class="mic-close" id="micClose"><i class="fas fa-times"></i></button>
        <div class="icon"><i class="fas fa-microphone"></i></div>
        <div class="text" id="micText">برای جستجو صحبت کنید...</div>
        <div class="result" id="micResult"></div>
    </div>

    <!-- ===== JSON پرینت ===== -->
    <div class="json-print-overlay" id="jsonOverlay">
        <div class="json-print-box">
            <div class="json-header">
                <h3><i class="fas fa-code"></i> JSON Export</h3>
                <button class="close-json" id="closeJson"><i class="fas fa-times"></i></button>
            </div>
            <pre id="jsonContent">{
  "expressions": []
}</pre>
            <div class="json-actions">
                <button class="copy-json" id="copyJson"><i class="fas fa-copy"></i> کپی</button>
                <button class="download-json" id="downloadJson"><i class="fas fa-download"></i> دانلود</button>
            </div>
        </div>
    </div>

    <!-- ===== محتوای اصلی ===== -->
    <div style="width:100%; max-width:600px;">

        <div class="logo-big-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
                <defs>
                    <style>
                        @keyframes lookAroundLeft {
                            0%, 100% { transform: translate(62px, 86px); }
                            20% { transform: translate(56px, 86px); }
                            40% { transform: translate(66px, 86px); }
                            60% { transform: translate(62px, 82px); }
                            80% { transform: translate(62px, 88px); }
                        }
                        @keyframes lookAroundRight {
                            0%, 100% { transform: translate(101px, 86px); }
                            20% { transform: translate(95px, 86px); }
                            40% { transform: translate(105px, 86px); }
                            60% { transform: translate(101px, 82px); }
                            80% { transform: translate(101px, 88px); }
                        }
                        @keyframes eyeBlink {
                            0%, 48%, 52%, 88%, 92%, 100% { transform: scaleY(1); }
                            50%, 90% { transform: scaleY(0.08); }
                        }
                        .left-comma-group { animation: lookAroundLeft 6s ease-in-out infinite; }
                        .right-comma-group { animation: lookAroundRight 6s ease-in-out infinite; }
                        .blink-element { transform-origin: 10px 0px; animation: eyeBlink 4s ease-in-out infinite; }
                    </style>
                </defs>
                <path d="M27 35 H153 V115 Q153 153 115 153 H65 Q27 153 27 115 Z" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M27 58 H153" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" />
                <g fill="#2fb557">
                    <g class="left-comma-group">
                        <g class="blink-element">
                            <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z" />
                        </g>
                    </g>
                    <g class="right-comma-group">
                        <g class="blink-element">
                            <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z" />
                        </g>
                    </g>
                </g>
            </svg>
        </div>

        <!-- جستجو -->
        <div class="search-wrapper">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="چی می‌خوای بگی؟ بنویس..." />
                <div class="actions">
                    <button class="add-btn" id="addBtn" title="افزودن"><i class="fas fa-plus-circle"></i></button>
                    <button class="filter-btn" id="filterBtn">
                        <i class="fas fa-sliders-h"></i>
                        <span class="filter-badge" id="filterBadge">0</span>
                    </button>
                    <button id="micBtn"><i class="fas fa-microphone"></i></button>
                    <button id="clearBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="filter-dropdown" id="filterDropdown">
                <div class="filter-grid" id="filterGrid"></div>
            </div>
        </div>

        <!-- ===== پنل افزودن ===== -->
        <div class="add-panel" id="addPanel">
            <input id="addEng" placeholder="English (e.g. I'm going to the store)" />
            <input id="addFa" placeholder="فارسی (مثلاً دارم می‌رم فروشگاه)" />
            <input id="addAr" placeholder="العربية (مثلاً أنا ذاهب إلى المتجر)" />

            <div class="color-picker-wrap">
                <label for="cardColor"><i class="fas fa-palette"></i> رنگ لاین</label>
                <input type="color" id="cardColor" value="#2fb557" />
            </div>

            <div class="tags-wrap" id="addTagsWrap">
                <span style="font-size:10px; color:rgba(255,255,255,0.12);">تگ‌ها</span>
            </div>
            <div class="add-actions">
                <button class="submit" id="addSubmit"><i class="fas fa-plus"></i> افزودن</button>
                <button class="cancel" id="addCancel">لغو</button>
            </div>
        </div>

        <!-- ===== پنل ویرایش ===== -->
        <div class="add-panel edit-panel" id="editPanel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:13px; color:#3b82f6; font-weight:600;"><i class="fas fa-edit"></i> ویرایش کارت</span>
                <button id="editCancel" style="background:transparent; border:none; color:rgba(255,255,255,0.2); cursor:pointer; font-size:14px;"><i class="fas fa-times"></i></button>
            </div>
            <input id="editEng" placeholder="English" />
            <input id="editFa" placeholder="فارسی" />
            <input id="editAr" placeholder="العربية" />
            <div class="color-picker-wrap">
                <label for="editColor"><i class="fas fa-palette"></i> رنگ لاین</label>
                <input type="color" id="editColor" value="#2fb557" />
            </div>
            <div class="tags-wrap" id="editTagsWrap"></div>
            <div class="add-actions">
                <button class="submit" id="editSubmit"><i class="fas fa-save"></i> ذخیره</button>
                <button class="cancel" id="editCancel2">لغو</button>
            </div>
        </div>

        <!-- برگشت -->
        <div class="back-wrap" id="backWrap">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-right"></i> برگشت</button>
        </div>

        <!-- نتایج -->
        <div class="results" id="results">
            <span class="count" id="resultCount">۰ نتیجه</span>
            <div class="cards" id="cardsContainer"></div>
        </div>

        <div class="info" id="info">0 جمله • 0 تگ</div>
    </div>

    <!-- ===== سایدبار ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="side-header">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="24" height="24">
                    <path d="M27 35 H153 V115 Q153 153 115 153 H65 Q27 153 27 115 Z" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M27 58 H153" fill="none" stroke="#2fb557" stroke-width="11" stroke-linecap="round"/>
                    <g fill="#2fb557">
                        <g transform="translate(62 86)">
                            <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z"/>
                        </g>
                        <g transform="translate(101 86)">
                            <path d="M0 0 Q0 -12 10 -12 Q20 -12 20 0 Q20 10 6 19 Q0 22 0 17 Q10 8 10 3 Q0 11 0 0Z"/>
                        </g>
                    </g>
                </svg>
                <span id="brandText">جیب</span>
            </div>
            <button class="sidebar-close" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" data-page="home"><i class="fas fa-home"></i> <span class="nav-label">صفحه اصلی</span></button>
            <button class="nav-item" data-page="explore"><i class="fas fa-compass"></i> <span class="nav-label">اکسپلور</span></button>
            <button class="nav-item" data-page="notes"><i class="fas fa-sticky-note"></i> <span class="nav-label">یادداشت</span> <span class="badge">nts</span></button>
            <button class="nav-item" data-page="chatgpt"><i class="fas fa-robot"></i> <span class="nav-label">ChatGPT</span></button>
            <button class="nav-item" data-page="deepseek"><i class="fas fa-brain"></i> <span class="nav-label">DeepSeek</span></button>
            <hr class="divider" />
            <button class="nav-item" data-page="bookmarks"><i class="fas fa-bookmark"></i> <span class="nav-label">نشان‌ها</span></button>
            <button class="nav-item" data-page="stats"><i class="fas fa-chart-simple"></i> <span class="nav-label">آمار</span></button>
            <button class="nav-item" data-page="folderA"><i class="fas fa-folder"></i> <span class="nav-label"> Chunk light </span></button>
            <button class="nav-item" data-page="clock"><i class="fas fa-clock"></i> <span class="nav-label">ساعت</span></button>
        </nav>
    </aside>
<script src="script.js"></script>
</body>
</html>
